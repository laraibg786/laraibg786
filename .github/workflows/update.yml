name: Update profile metrics

on:
  schedule:
    - cron: "0 0 * * *" # every midnight, UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/**, assets/fonts/**, .github/workflows/update.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Fetch pull requests and issues
        run: tools/stats/fetch.sh
      - name: Render the follow-up card
        run: uv run --script tools/stats/cards.py
      - name: Generate the contribution snake
        run: |
          node tools/snake/snk.mjs --github_user="$GITHUB_REPOSITORY_OWNER" \
            --output=metrics/snake.svg \
            --output=metrics/snake-dark.svg?palette=github-dark
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || git commit -m "chore: update metrics"
          git push
